[package]
name = "nullamp-audio"
description = "Nullamp audio engine: decoding on a dedicated thread, resampling, and cpal output."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
symphonia = { version = "0.6.1", features = ["mp3", "aac", "isomp4", "alac", "aiff", "caf"] }
rubato = "5.0"
realfft = "3.5"
audioadapter-buffers = "5.1"
rtrb = "0.3"
rusty-chromaprint = "0.3"
base64 = "0.22"
crossbeam-channel.workspace = true
log.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18.2", features = ["pulseaudio"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
cpal = "0.18.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-audio = "0.3"
objc2-core-foundation = { version = "0.3", features = ["CFString"] }
