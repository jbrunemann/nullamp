[package]
name = "nullamp-android"
description = "The Android app: a native activity around the nullamp library."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

# The same switches as the app's. `--no-default-features` is the build for an app store (android/build.sh store).
[features]
default = ["online-extras", "update-check"]
online-extras = ["nullamp/online-extras"]
update-check = ["nullamp/update-check"]

[target.'cfg(target_os = "android")'.dependencies]
nullamp = { path = "../app", default-features = false }
nullamp-sysmedia = { path = "../crates/nullamp-sysmedia" }
android-activity = { version = "0.6", features = ["native-activity"] }

[package.metadata.android]
package = "dev.nullamp.player"
apk_name = "nullamp"
resources = "res"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[package.metadata.android.application]
label = "Nullamp"
icon = "@mipmap/ic_launcher"

[package.metadata.android.application.activity]
config_changes = "orientation|keyboardHidden|screenSize|smallestScreenSize|screenLayout|uiMode"

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_MEDIA_AUDIO"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"
max_sdk_version = 32

# The media service: plays in the background with a notification and the lock screen controls (android/java/).
[[package.metadata.android.uses_permission]]
name = "android.permission.FOREGROUND_SERVICE"

[[package.metadata.android.uses_permission]]
name = "android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"

[[package.metadata.android.uses_permission]]
name = "android.permission.POST_NOTIFICATIONS"

[[package.metadata.android.uses_permission]]
name = "android.permission.WAKE_LOCK"

# Lists any folder and writes tags to files other apps made. A prototype's shortcut: Play does not allow it for most apps.
[[package.metadata.android.uses_permission]]
name = "android.permission.MANAGE_EXTERNAL_STORAGE"
