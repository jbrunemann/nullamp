[package]
name = "nullamp"
description = "A fast, retro-inspired music and DJ mix player."
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "nullamp"

[lib]
name = "nullamp"
path = "src/lib.rs"

[[bin]]
name = "nullamp"
path = "src/main.rs"

[dependencies]
nullamp-core.workspace = true
nullamp-audio.workspace = true
nullamp-meta.workspace = true
nullamp-sysmedia.workspace = true
nullamp-update.workspace = true
nullamp-artwork.workspace = true
nullamp-shazam.workspace = true
nullamp-telegram.workspace = true
nullamp-tracklists.workspace = true
nullamp-spotify.workspace = true
nullamp-rekordbox.workspace = true
nullamp-mixxx.workspace = true
serde.workspace = true
serde_json.workspace = true
crossbeam-channel.workspace = true
log.workspace = true
eframe = { version = "0.37", features = ["persistence"] }
egui = "0.37"
rfd = "0.17"
pollster = "0.4"
directories = "6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
raw-window-handle = "0.6"
zip = { version = "9.1.1", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["eframe", "wgpu", "snapshot"] }
tempfile.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21.2", default-features = false }
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSObject", "NSString", "NSArray", "NSNotification"] }
