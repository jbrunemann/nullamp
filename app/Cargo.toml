[package]
name = "nullamp"
description = "A fast, retro-inspired music and DJ mix player."
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "nullamp"

[lib]
name = "nullamp"
path = "src/lib.rs"

[[bin]]
name = "nullamp"
path = "src/main.rs"

[features]
default = ["online-extras", "update-check"]
# Identify with Shazam, Search 1001Tracklists and Request on Telegram, with the Settings tabs they need. They use services
# that offer no API for this (see "Online sources" in docs/HANDOFF.md). Off, a build has no way to reach them.
online-extras = []
# The Settings > Updates tab. App stores do their own updates, so a store build leaves it out.
update-check = []

[dependencies]
nullamp-core.workspace = true
nullamp-audio.workspace = true
nullamp-meta.workspace = true
nullamp-sysmedia.workspace = true
nullamp-update.workspace = true
nullamp-artwork.workspace = true
nullamp-shazam.workspace = true
nullamp-telegram.workspace = true
nullamp-tracklists.workspace = true
nullamp-rekordbox.workspace = true
nullamp-mixxx.workspace = true
serde.workspace = true
serde_json.workspace = true
crossbeam-channel.workspace = true
log.workspace = true
egui = "0.37"
pollster = "0.4"
directories = "6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
raw-window-handle = "0.6"

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["eframe", "wgpu", "snapshot"] }
tempfile.workspace = true

# Native file dialogs; Android has none, and `ui/dialogs.rs` stands in for them there.
[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { version = "0.37", features = ["persistence"] }
rfd = "0.17"

# NativeActivity needs no Java or C glue, but eframe's accesskit only works with GameActivity, so it stays off.
[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "persistence", "android-native-activity"] }
android-activity = { version = "0.6", features = ["native-activity"] }
# Android has no curl: the online features ask with ureq.
nullamp-http = { workspace = true, features = ["rustls"] }
jni = "0.22"
android_logger = "0.15"

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21.2", default-features = false }
