[workspace]
resolver = "3"
members = ["crates/*", "app", "android"]
# The Android crate only builds for Android, through cargo-apk (see android/README.md).
default-members = ["crates/*", "app"]
# A path dependency inside the workspace directory would become a member.
exclude = ["vendor"]

[workspace.package]
version = "2.3.3"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.88"

[workspace.dependencies]
nullamp-core = { path = "crates/nullamp-core" }
nullamp-audio = { path = "crates/nullamp-audio" }
nullamp-meta = { path = "crates/nullamp-meta" }
nullamp-sysmedia = { path = "crates/nullamp-sysmedia" }
nullamp-http = { path = "crates/nullamp-http" }
nullamp-update = { path = "crates/nullamp-update" }
nullamp-artwork = { path = "crates/nullamp-artwork" }
nullamp-shazam = { path = "crates/nullamp-shazam" }
nullamp-telegram = { path = "crates/nullamp-telegram" }
nullamp-tracklists = { path = "crates/nullamp-tracklists" }
nullamp-spotify = { path = "crates/nullamp-spotify" }
nullamp-soundcloud = { path = "crates/nullamp-soundcloud" }
nullamp-rekordbox = { path = "crates/nullamp-rekordbox" }
nullamp-mixxx = { path = "crates/nullamp-mixxx" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
crossbeam-channel = "0.5"
log = "0.4"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 4

[profile.dev]
# Full debug info made target/debug tens of gigabytes; line tables still give backtraces.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

# egui-winit 0.37.0 with one change (see vendor/egui-winit/src/lib.rs, marked "Nullamp"): the Android soft keyboard
# flickered while a finger rested on a text field.
[patch.crates-io]
egui-winit = { path = "vendor/egui-winit" }
