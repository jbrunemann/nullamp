[workspace]
resolver = "3"
members = ["crates/*", "app"]

[workspace.package]
version = "1.5.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
nullamp-core = { path = "crates/nullamp-core" }
nullamp-audio = { path = "crates/nullamp-audio" }
nullamp-meta = { path = "crates/nullamp-meta" }
nullamp-sysmedia = { path = "crates/nullamp-sysmedia" }
nullamp-update = { path = "crates/nullamp-update" }
nullamp-artwork = { path = "crates/nullamp-artwork" }
nullamp-rekordbox = { path = "crates/nullamp-rekordbox" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
crossbeam-channel = "0.5"
log = "0.4"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 4

[profile.dev.package."*"]
opt-level = 2
