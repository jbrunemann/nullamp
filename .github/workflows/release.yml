name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # One test at a time: the UI tests wait fixed times for background work (waveform, cover),
      # which the three shared cores of the runner cannot do while many tests run side by side.
      # The runner has no audio output, so the engine fails every load and the deck clears itself;
      # these tests play a file and look at the deck, which only works with a device (they pass locally).
      - name: Test
        run: >
          cargo test --workspace -- --test-threads=1
          --skip ui_snapshots::rekordbox_waveform_is_cached_for_the_same_file_elsewhere
          --skip ui_snapshots::setlist_hidden_for_single_tracks
          --skip ui_snapshots::the_deck_cover_changes_between_files_with_a_transition
          --skip ui_snapshots::sections_give_way_as_the_window_narrows
      - name: Bundle
        run: packaging/macos/bundle.sh
      - name: Zip
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          ditto -c -k --keepParent target/bundle/Nullamp.app "Nullamp-${VERSION}-macos-arm64.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Nullamp-macos-arm64
          path: Nullamp-*-macos-arm64.zip

  # Built on the oldest hosted Ubuntu so the binary runs against an older glibc.
  linux-x86_64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libxkbcommon-dev libwayland-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build
        run: cargo build --release -p nullamp
      - name: Package
        run: packaging/linux/package.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Nullamp-linux-x86_64
          path: Nullamp-*-linux-x86_64.tar.gz

  windows-x86_64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build
        run: cargo build --release -p nullamp
      - name: Package
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $dir = "Nullamp-$version-windows-x86_64"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item target/release/nullamp.exe "$dir/Nullamp.exe"
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Nullamp-windows-x86_64
          path: Nullamp-*-windows-x86_64.zip

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos-arm64, linux-x86_64, windows-x86_64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: Nullamp-*
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Nullamp-* --repo "$GITHUB_REPOSITORY" --generate-notes
