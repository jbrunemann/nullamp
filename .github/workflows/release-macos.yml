name: macOS release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace
      - name: Bundle
        run: packaging/macos/bundle.sh
      - name: Zip
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          ditto -c -k --keepParent target/bundle/Nullamp.app "Nullamp-${VERSION}-macos-arm64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Nullamp-macos-arm64
          path: Nullamp-*-macos-arm64.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Nullamp-*-macos-arm64.zip --generate-notes
